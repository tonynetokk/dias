<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4EE">
<title>Dias sem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap">
<style>
:root{--bg:#F2F4EE;--surface:#FFFFFF;--ink:#1B2420;--muted:#5E6B64;--line:#D9DFD5;--accent:#1B7F5C;--accent-ink:#FFFFFF;--track:#E3E8DF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121816;--surface:#1B2420;--ink:#EDF2EE;--muted:#9AA8A0;--line:#2D3A34;--accent:#5FD3A5;--accent-ink:#0B2A1F;--track:#2D3A34}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--surface:#1B2420;--ink:#EDF2EE;--muted:#9AA8A0;--line:#2D3A34;--accent:#5FD3A5;--accent-ink:#0B2A1F;--track:#2D3A34}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:1.1rem;font-weight:700;margin:0 0 20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px;margin-bottom:16px}
.name{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.big{display:flex;align-items:baseline;gap:10px;margin:8px 0 2px}
.num{font-size:5rem;font-weight:800;line-height:.95;letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.unit{font-size:1.2rem;font-weight:700;color:var(--muted)}
.sub{color:var(--muted);font-size:.92rem}
.track{height:8px;border-radius:99px;background:var(--track);margin:16px 0 6px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px}
.row{display:flex;gap:10px;margin-top:16px}
.btn{font:inherit;font-size:.92rem;font-weight:700;border:1px solid var(--line);background:none;color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
.btn.warn{border-color:var(--ink)}
.btn.ghost{color:var(--muted);font-weight:400}
.empty{color:var(--muted);padding:10px 4px 20px}
form{display:grid;gap:10px;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
label{font-size:.9rem;color:var(--muted);display:grid;gap:5px}
input{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
button.add{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:4px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Dias sem</h1>
  <div id="list"></div>
  <form id="f">
    <label>Do que você parou?<input id="name" maxlength="50" placeholder="Ex.: cigarro, álcool, apostas, açúcar" required></label>
    <label>Dia em que parou<input id="date" type="date" required></label>
    <button class="add" type="submit">Começar a contar</button>
  </form>
</main>
<script>
(function(){
  var KEY="dias-sem-v1", MS=[1,3,7,14,30,60,90,180,365,730,1095], items=[], armed=null, timer=null;
  try{ items=JSON.parse(localStorage.getItem(KEY)||"[]"); if(!Array.isArray(items)) items=[]; }catch(e){ items=[]; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){} }
  function todayIso(){ var n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
  function days(iso){
    var p=iso.split("-").map(Number), n=new Date();
    return Math.max(0,Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(p[0],p[1]-1,p[2]))/86400000));
  }
  function fmt(iso){ var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function esc(s){ return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function d(n){ return n+(n===1?" dia":" dias"); }
  function render(){
    var el=document.getElementById("list");
    if(!items.length){ el.innerHTML='<p class="empty">Nenhuma contagem ainda. Informe abaixo do que você parou e o dia em que parou.</p>'; return; }
    el.innerHTML=items.map(function(it){
      var n=days(it.date), best=Math.max(it.best||0,n), next=null;
      for(var i=0;i<MS.length;i++){ if(MS[i]>n){ next=MS[i]; break; } }
      var pct=next?Math.round(n/next*100):100;
      var goal=next?("Próxima meta: "+d(next)+" (faltam "+(next-n)+")"):"Você passou de 3 anos. Parabéns!";
      var arm=armed===it.id;
      return '<section class="card"><div class="name">Sem '+esc(it.name)+'</div>'+
        '<div class="big"><span class="num">'+n+'</span><span class="unit">'+(n===1?"dia":"dias")+'</span></div>'+
        '<div class="sub">Desde '+fmt(it.date)+' · melhor sequência: '+d(best)+'</div>'+
        '<div class="track" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:'+pct+'%"></div></div>'+
        '<div class="sub">'+goal+'</div>'+
        '<div class="row"><button class="btn warn" data-act="reset" data-id="'+it.id+'">'+(arm?"Confirmar: recomeçar hoje":"Recomeçar")+'</button>'+
        '<button class="btn ghost" data-act="del" data-id="'+it.id+'">Remover</button></div></section>';
    }).join("");
  }
  var dt=document.getElementById("date"); dt.max=todayIso(); dt.value=todayIso();
  document.getElementById("f").addEventListener("submit",function(e){
    e.preventDefault();
    var n=document.getElementById("name");
    if(!n.value.trim()||!dt.value) return;
    items.push({id:Date.now().toString(36),name:n.value.trim(),date:dt.value,best:0});
    save(); render(); n.value=""; dt.value=todayIso();
  });
  document.getElementById("list").addEventListener("click",function(e){
    var b=e.target.closest("button[data-act]"); if(!b) return;
    var id=b.getAttribute("data-id"), act=b.getAttribute("data-act");
    if(act==="del"){
      if(armed!=="del"+id){ armed="del"+id; b.textContent="Confirmar remoção"; clearTimeout(timer); timer=setTimeout(function(){armed=null;render();},4000); return; }
      items=items.filter(function(i){return i.id!==id;}); armed=null; save(); render(); return;
    }
    if(armed!==id){ armed=id; render(); clearTimeout(timer); timer=setTimeout(function(){armed=null;render();},4000); return; }
    items.forEach(function(i){ if(i.id===id){ i.best=Math.max(i.best||0,days(i.date)); i.date=todayIso(); } });
    armed=null; save(); render();
  });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden){ dt.max=todayIso(); render(); } });
  render();
})();
</script>
</body>
</html>
